backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "ideas"
    label: "Ideas"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Organizational Commitments", "Communication & Believability", "Commitment to Reality", "Conditions & Coherence", "Evidence & Return", "Portfolio Governance"]}
      - {label: "Read Time", name: "readtime", widget: "string", hint: "e.g. 5 min read"}
      - {label: "Summary", name: "summary", widget: "text", hint: "One or two sentences shown on the Ideas index page"}
      - {label: "Body", name: "body", widget: "markdown"}
