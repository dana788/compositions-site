  <style>
    :root {
      --teal: #16768C; --teal-dark: #144E73; --teal-light: #A3D2D8;
      --charcoal: #2C2C2C; --off-white: #F8F8F8; --white: #FFFFFF;
      --text: #1A1A1A; --text-sec: #63615D; --border: #E2E0DA;
      --font-display: 'Oswald', sans-serif; --font-body: 'Poppins', sans-serif;
      --max-width: 1100px; --content-width: 720px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-body); font-weight: 300; color: var(--text); background: var(--white); -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; }
    p { margin: 0; }
    ul, ol { margin: 0; padding: 0; }
    button { font-family: var(--font-body); cursor: pointer; }
    :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
    .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 32px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.03em; padding: 14px 28px; border: 1.5px solid transparent; cursor: pointer; transition: all 0.2s ease; }
    .btn-teal { background: var(--teal); color: var(--white); }
    .btn-teal:hover { background: var(--teal-dark); transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--white); border-color: rgba(255,255,255,0.35); }
    .btn-outline:hover { border-color: var(--white); }

    /* NAV */
    .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; background: rgba(248,248,248,0.94); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--border); }
    .logo-mark img { height: 26px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 40px; }
    .nav-link { position: relative; font-weight: 500; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--charcoal); padding-bottom: 6px; }
    .nav-link.active { color: var(--teal-dark); }
    .nav-link::after { content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 1.5px; background: var(--teal); transition: width 0.2s ease; }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .nav-cta { margin-left: 8px; padding: 12px 24px; }
    .hamburger { display: none; background: none; border: none; width: 32px; height: 32px; position: relative; z-index: 310; cursor: pointer; }
    .hamburger span { display: block; position: absolute; left: 4px; right: 4px; height: 2px; background: var(--charcoal); }
    .hamburger span:nth-child(1) { top: 10px; } .hamburger span:nth-child(2) { top: 16px; } .hamburger span:nth-child(3) { top: 22px; }
    .mobile-menu { position: fixed; inset: 0; background: var(--off-white); z-index: 290; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; transform: translateY(-100%); opacity: 0; visibility: hidden; transition: transform 0.35s ease, opacity 0.3s ease, visibility 0.35s; }
    .mobile-menu.open { transform: translateY(0); opacity: 1; visibility: visible; }
    .mobile-menu a { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--charcoal); }
    @media (max-width: 860px) { .nav-links { display: none; } .hamburger { display: block; } }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

    .back-to-top { position: fixed; right: 24px; bottom: 24px; width: 44px; height: 44px; background: var(--charcoal); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; border: none; color: var(--white); cursor: pointer; }
    .back-to-top.visible { opacity: 1; visibility: visible; }
    .back-to-top:hover { background: var(--teal); }

    /* POST HERO */
    .post-hero { padding: 148px 32px 64px; background: var(--charcoal); }
    .post-hero .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .post-hero .breadcrumb a { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
    .post-hero .breadcrumb a:hover { color: var(--teal-light); }
    .post-hero .breadcrumb span { color: rgba(255,255,255,0.25); font-size: 0.72rem; }
    .post-hero .category-tag { display: inline-block; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal-light); border: 1px solid rgba(163,210,216,0.35); padding: 6px 12px; margin-bottom: 20px; }
    .post-hero h1 { font-size: clamp(1.7rem, 3.6vw, 2.6rem); color: var(--white); line-height: 1.25; max-width: 800px; }
    .post-hero .post-meta { display: flex; align-items: center; gap: 24px; margin-top: 22px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.1); }
    .post-hero .post-meta span { font-size: 0.8rem; color: rgba(255,255,255,0.45); }
    .post-hero .post-meta .read-time { color: var(--teal-light); font-weight: 600; }

    /* POST BODY */
    .post-body { padding: 64px 32px 96px; background: var(--white); }
    .post-content { max-width: var(--content-width); margin: 0 auto; }
    .post-content p { font-size: 1.04rem; line-height: 1.85; color: var(--text); margin-bottom: 1.6em; }
    .post-content h2 { font-size: 1.4rem; color: var(--charcoal); margin-top: 2.2em; margin-bottom: 0.6em; font-weight: 600; line-height: 1.3; }
    .post-content h3 { font-size: 1.15rem; color: var(--charcoal); margin-top: 1.8em; margin-bottom: 0.5em; font-weight: 600; }
    .post-content h4 { font-size: 0.95rem; color: var(--charcoal); margin-top: 1.5em; margin-bottom: 0.4em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .post-content ul, .post-content ol { margin-bottom: 1.6em; padding-left: 1.4em; }
    .post-content li { font-size: 1.04rem; line-height: 1.8; color: var(--text); margin-bottom: 0.4em; }
    .post-content blockquote { border-left: 3px solid var(--teal); margin: 2em 0; padding: 18px 22px; background: var(--off-white); }
    .post-content blockquote p { font-size: 1.05rem; font-style: italic; color: var(--charcoal); margin-bottom: 0; line-height: 1.7; }
    .post-content strong { font-weight: 600; color: var(--charcoal); }
    .post-content hr { border: none; border-top: 1px solid var(--border); margin: 2.2em 0; }
    .post-content a { color: var(--teal-dark); text-decoration: underline; text-underline-offset: 3px; }
    .post-content code { font-family: monospace; background: var(--off-white); padding: 2px 6px; font-size: 0.9em; }
    .pull-quote { border-left: none; background: var(--charcoal); padding: 30px 36px; margin: 2.2em 0; }
    .pull-quote p { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; font-style: normal; color: var(--white); line-height: 1.45; margin-bottom: 0; }

    .post-footer { max-width: var(--content-width); margin: 44px auto 0; padding-top: 36px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .post-footer .back-link { font-weight: 600; font-size: 0.85rem; color: var(--teal-dark); }
    .post-footer .share-label { font-size: 0.8rem; color: var(--text-sec); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

    .cta-band { background: var(--charcoal); padding: 76px 32px; text-align: center; }
    .cta-band .eyebrow { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal-light); margin-bottom: 20px; }
    .cta-band .eyebrow::before { content: ""; display: inline-block; width: 36px; height: 2px; background: var(--teal); }
    .cta-band h2 { font-size: clamp(1.35rem, 2.6vw, 1.9rem); color: var(--white); max-width: 600px; margin: 0 auto 12px; line-height: 1.35; }
    .cta-band p { color: rgba(255,255,255,0.55); max-width: 480px; margin: 0 auto 30px; font-size: 0.92rem; line-height: 1.7; }
    .cta-band .cta-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .post-error { max-width: var(--content-width); margin: 0 auto; padding: 70px 0; text-align: center; }
    .post-error h2 { font-size: 1.3rem; color: var(--charcoal); margin-bottom: 12px; }
    .post-error p { color: var(--text-sec); line-height: 1.6; margin-bottom: 26px; }
    .skeleton-hero { padding: 148px 32px 64px; background: var(--charcoal); }
    .skeleton-line { height: 14px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 12px; animation: shimmer 1.4s infinite; }
    .skeleton-line.title { height: 36px; width: 78%; margin-bottom: 8px; }
    .skeleton-line.title2 { height: 36px; width: 52%; }
    .skeleton-line.short { width: 22%; }
    @keyframes shimmer { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    footer { background: var(--charcoal); padding: 64px 32px 32px; }
    .footer-inner { max-width: var(--max-width); margin: 0 auto; }
    .footer-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 40px; padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .footer-brand img { height: 22px; width: auto; }
    .footer-cols { display: flex; gap: 56px; flex-wrap: wrap; }
    .footer-cols h4 { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
    .footer-cols ul { display: flex; flex-direction: column; gap: 10px; }
    .footer-cols a { color: rgba(255,255,255,0.55); font-size: 0.88rem; }
    .footer-cols a:hover { color: var(--white); }
    .footer-bottom { padding-top: 24px; color: rgba(255,255,255,0.35); font-size: 0.76rem; }

    @media (max-width: 768px) {
      .post-hero { padding: 128px 20px 48px; }
      .post-body { padding: 48px 20px 72px; }
      .post-footer { flex-direction: column; align-items: flex-start; }
      .cta-band .cta-actions { flex-direction: column; align-items: center; }
      .pull-quote { padding: 22px 22px; }
    }
  </style>
</head>

  <script>
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => backToTop.classList.toggle('visible', window.scrollY > 400));
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      const open = mobileMenu.classList.toggle('open');
      hamburger.classList.toggle('open', open);
      hamburger.setAttribute('aria-expanded', open);
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      mobileMenu.classList.remove('open'); hamburger.classList.remove('open'); hamburger.setAttribute('aria-expanded', false);
    }));

    const revealObserver = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObserver.unobserve(e.target); } });
    }, { threshold: 0.1 });

    /* MARKDOWN PARSER (unchanged from the proven Decap-integration pattern) */
    function parseMarkdown(md) {
      let html = md
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^---$/gm, '<hr>')
        .replace(/^> (.+)$/gm, '<blockquote class="pull-quote"><p>$1</p></blockquote>')
        .replace(/^\- (.+)$/gm, '<li>$1</li>')
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/`(.+?)`/g, '<code>$1</code>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
      const lines = html.split('\n');
      const blocked = ['<h2', '<h3', '<h4', '<ul', '<li', '<blockquote', '<hr', '</ul'];
      const result = [];
      let buf = [];
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) { if (buf.length) { result.push(`<p>${buf.join(' ')}</p>`); buf = []; } }
        else if (blocked.some(tag => trimmed.startsWith(tag))) { if (buf.length) { result.push(`<p>${buf.join(' ')}</p>`); buf = []; } result.push(trimmed); }
        else { buf.push(trimmed); }
      }
      if (buf.length) result.push(`<p>${buf.join(' ')}</p>`);
      return result.join('\n');
    }

    function parseFrontmatter(text) {
      const match = text.match(/^---\n([\s\S]*?)\n---/);
      if (!match) return { body: text, meta: {} };
      const raw = match[1];
      const body = text.slice(match[0].length).trim();
      const meta = {};
      raw.split('\n').forEach(line => {
        const sep = line.indexOf(':');
        if (sep === -1) return;
        const key = line.slice(0, sep).trim();
        const val = line.slice(sep + 1).trim().replace(/^["']|["']$/g, '');
        meta[key] = val;
      });
      return { meta, body };
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try { return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); } catch { return ''; }
    }

    function renderError(message) {
      document.getElementById('postContainer').innerHTML = `
        <section style="padding: 148px 32px 96px; background: var(--white);">
          <div class="post-error">
            <h2>Post not found</h2>
            <p>${message}</p>
            <a href="/ideas/" class="btn btn-teal">← Back to Ideas</a>
          </div>
        </section>`;
    }

    function renderPost(meta, bodyHtml) {
      const title = meta.title || 'Untitled';
      const category = meta.category || 'Ideas';
      const categorySlug = (meta.categorySlug || category).toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const date = formatDate(meta.date);
      const readtime = meta.readtime || '';
      const pageUrl = window.location.href;

      document.getElementById('pageTitle').textContent = `${title} | Compositions`;
      document.getElementById('pageDescription').setAttribute('content', meta.summary || '');
      document.getElementById('pageCanonical').setAttribute('href', pageUrl);
      document.getElementById('ogTitle').setAttribute('content', `${title} | Compositions`);
      document.getElementById('ogDescription').setAttribute('content', meta.summary || '');
      document.getElementById('ogUrl').setAttribute('content', pageUrl);

      document.getElementById('postContainer').innerHTML = `
        <section class="post-hero">
          <div class="wrap reveal">
            <div class="breadcrumb">
              <a href="/ideas/">Ideas</a>
              <span>/</span>
              <a href="/ideas/?filter=${encodeURIComponent(categorySlug)}">${category}</a>
            </div>
            <span class="category-tag">${category}</span>
            <h1>${title}</h1>
            <div class="post-meta">
              ${date ? `<span>${date}</span>` : ''}
              ${readtime ? `<span class="read-time">${readtime}</span>` : ''}
            </div>
          </div>
        </section>

        <section class="post-body">
          <div class="post-content reveal">${bodyHtml}</div>
          <div class="post-footer reveal">
            <a href="/ideas/" class="back-link">← Back to Ideas</a>
            <span class="share-label">Share on
              <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener" style="color:var(--teal-dark);margin-left:8px;font-weight:600;">LinkedIn →</a>
            </span>
          </div>
        </section>

        <section class="cta-band">
          <div class="wrap reveal">
            <p class="eyebrow">Start Here</p>
            <h2>What commitments has your organization made?</h2>
            <p>Bring us the commitment, the outcome you're after, or what isn't working the way you hoped.</p>
            <div class="cta-actions">
              <a href="/#start" class="btn btn-teal">Start a Conversation</a>
              <a href="/ideas/" class="btn btn-outline">More Ideas</a>
            </div>
          </div>
        </section>`;

      document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
    }

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) { renderError('No post was specified.'); return; }

      document.getElementById('postContainer').innerHTML = `
        <div class="skeleton-hero">
          <div class="wrap">
            <div class="skeleton-line short" style="margin-bottom:24px;"></div>
            <div class="skeleton-line title"></div>
            <div class="skeleton-line title2"></div>
            <div class="skeleton-line short" style="margin-top:20px;"></div>
          </div>
        </div>`;

      const GITHUB_USER = 'dana788';
      const GITHUB_REPO = 'compositions-site';
      const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/_posts/${slug}.md`;

      try {
        const res = await fetch(RAW_URL);
        if (!res.ok) throw new Error('Post file not found.');
        const text = await res.text();
        const { meta, body } = parseFrontmatter(text);
        const bodyHtml = parseMarkdown(body);
        renderPost(meta, bodyHtml);
      } catch (err) {
        renderError('This post could not be loaded. It may not be published yet, or the slug may not match a file in _posts.');
        console.error('Post load error:', err);
      }
    }

    loadPost();
  </script>
